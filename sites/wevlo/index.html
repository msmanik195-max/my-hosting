<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>WEVLO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:#eceff4}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#0f172a;-webkit-font-smoothing:antialiased;font-size:14px}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{max-width:480px;min-height:100vh;margin:0 auto;background:#f8fafc;position:relative;box-shadow:0 0 32px rgba(15,23,42,.12);overflow-x:hidden}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Header */
.hd{position:sticky;top:0;z-index:20;height:55px;background:#fff;border-bottom:1px solid #e4e8ef;display:flex;align-items:center;padding:0 20px 0 21px}
.logo{width:32px;height:32px;border-radius:8px;background:#0a1ff5;color:#fff;display:grid;place-items:center;font-weight:800;font-size:13.5px;letter-spacing:-.6px}
.brand{font-weight:800;font-size:18.5px;margin-left:10px;letter-spacing:-.2px}
.search{margin-left:auto;width:189px;height:36px;border-radius:18px;background:#eff2f7;display:flex;align-items:center;padding:0 14px 0 12px;gap:9px;color:#8a94a6}
.search .ic{width:20px;height:20px}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:14.5px;font-weight:500;color:#0f172a}
.search input::placeholder{color:#9aa4b5}
.search button{display:grid;place-items:center;color:#6b7686}
.hs{gap:12px}
.hs .bk{width:36px;height:36px;border-radius:12px;background:#eff2f7;display:grid;place-items:center;color:#0f172a}
.hs b{font-size:17px;font-weight:700;flex:1}
.hs .sv{height:34px;padding:0 16px;border-radius:12px;background:#2563eb;color:#fff;font-weight:700;font-size:13.5px}

#view{padding-bottom:84px}

/* Hero */
.hero{margin:13px 12px 0;border-radius:20px;padding:18px 18px 20px;background:linear-gradient(120deg,#1b2d80 0%,#2457e0 52%,#0e90b2 100%);position:relative;overflow:hidden;color:#fff}
.hero h2{font-size:19px;font-weight:700;line-height:30px;margin-bottom:18px;position:relative;z-index:2;letter-spacing:-.1px}
.hr{display:flex;gap:10px;margin-bottom:10px;position:relative;z-index:2}
.hr:last-child{margin-bottom:0}
.hb{height:37px;border-radius:14px;padding:0 16px;display:flex;align-items:center;gap:7px;font-weight:600;font-size:14.5px;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.34);backdrop-filter:blur(3px);white-space:nowrap}
.hb .ic{width:20px;height:20px;stroke-width:1.9}
.hb.w{background:#fff;color:#2563eb;border-color:#fff;box-shadow:0 4px 14px rgba(8,20,80,.25)}
.hb.cy{color:#8cf0ff}
.fx{position:absolute;z-index:1;border-radius:99px;animation:fl 5s ease-in-out infinite}
.fx.d{width:7px;height:7px}
.fx.p{height:7px;background:rgba(255,255,255,.26)}
.fx.b{background:rgba(120,170,255,.5)}
@keyframes fl{50%{transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.fx{animation:none}}

/* Stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:20px 12px 0}
.st{height:73px;background:#fff;border:1px solid #dfe4ec;border-radius:18px;display:flex;align-items:center;gap:14px;padding:0 0 0 16px;text-align:left;box-shadow:0 1px 2px rgba(15,23,42,.03)}
.st .ib{width:44px;height:44px;border-radius:13px;display:grid;place-items:center}
.st .ib .ic{width:24px;height:24px}
.st b{display:block;font-size:21px;font-weight:700;line-height:25px;letter-spacing:-.2px}
.st span{display:block;font-size:13.5px;color:#5f6b7f;font-weight:500;line-height:19px}
.c-blue{background:#eaf2ff;color:#2563eb}.c-green{background:#e4f8ef;color:#16a97a}.c-amber{background:#fff8e1;color:#f59e0b}.c-purple{background:#f3efff;color:#7c4dec}

/* Section */
.sh{display:flex;align-items:center;justify-content:space-between;margin:27px 12px 0}
.sh h3{font-size:17.5px;font-weight:700;letter-spacing:-.2px}
.sh a{color:#2563eb;font-weight:600;font-size:14px;display:flex;align-items:center;gap:2px;text-decoration:none;cursor:pointer}
.sh a .ic{width:18px;height:18px;stroke-width:2.2}
.pg-grid{display:grid;grid-template-columns:1fr 1fr;gap:8.5px;margin:14px 12px 0}
.np{border:2px dashed #d6dde9;border-radius:16px;background:linear-gradient(#f1f5fd,#edf1fa);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;color:#6b7686;font-weight:600;font-size:15px;min-height:185px}
.np i{width:34px;height:34px;border-radius:50%;background:#e4e8ef;display:grid;place-items:center}
.np i .ic{width:20px;height:20px}
.pc{background:#fff;border:1px solid #dfe4ec;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.th{height:91px;background:linear-gradient(#dde2fb,#e4e8fd);position:relative;display:grid;place-items:center}
.th svg.rb{width:64px;height:72px;margin-top:2px}
.tag{position:absolute;top:7px;right:7px;height:18px;padding:0 8px;border-radius:99px;background:#4f46e5;color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;letter-spacing:.2px}
.pb{padding:10px 11px 10px}
.pb h4{font-size:14.5px;font-weight:600;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb p{display:flex;align-items:center;gap:6px;color:#7b8798;font-size:12.5px;line-height:16px;margin-top:2px}
.pb p .ic{width:14px;height:14px}
.pa{display:flex;gap:6px;margin-top:8px}
.pa button{flex:1;height:28px;border-radius:8px;background:#eef1f8;border:1px solid #dde2ee;color:#5b63a8;font-size:12.5px;font-weight:600}
.empty{text-align:center;padding:30px 20px 12px}
.empty i{display:grid;place-items:center;width:72px;height:72px;border-radius:22px;background:#eef1f6;margin:0 auto 20px;color:#8a94a6}
.empty i .ic{width:30px;height:30px}
.empty b{display:block;font-size:18px;font-weight:700}
.empty p{color:#6b7686;font-size:15px;line-height:24px;max-width:250px;margin:8px auto 0}
.dl{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #dfe4ec;border-radius:16px;padding:10px 12px;margin:12px 12px 0}
.dl i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.dl b{display:block;font-size:14.5px;font-weight:600}.dl span{font-size:12.5px;color:#7b8798}

/* Lab / Store */
.ft{padding:14px 12px 24px;border-bottom:1px solid #e3e7ee;background:#fff}
.ft h3{display:flex;align-items:center;gap:8px;color:#7c3aed;font-size:17px;font-weight:700;margin-bottom:9px}
.ft h3 .ic{width:20px;height:20px}
.fc{width:110px;text-align:center}
.fv{width:110px;height:90px;border-radius:10px;overflow:hidden;background:#ece9fb;position:relative;font-family:'Noto Serif',Georgia,serif;font-weight:700;font-size:30px;line-height:37px;padding:0 0 0 8px;text-align:left;color:#000;white-space:nowrap}
.fv::after{content:"";position:absolute;right:0;top:0;width:8px;height:78%;background:#b4b6c4}
.fc b{display:block;color:#7c3aed;font-size:14px;margin-top:8px;font-weight:700}
.fc span{font-size:13px;color:#7b8798}
.jy{font-size:16px;font-weight:700;margin:22px 12px 14px}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 9px}
.lc{background:#fff;border:1px solid #dfe4ec;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.lp{height:149px;position:relative;overflow:hidden}
.lp .art{position:absolute;inset:0;width:100%;height:100%}
.lp.hi{background:#eff2f7;font-family:'Noto Serif',Georgia,serif;color:#000;padding:22px 9px}
.lp.hi h1{font-size:32px;line-height:38px;font-weight:700}
.lp.hi p{font-size:17px;margin-top:18px;line-height:22px;white-space:nowrap}
.lp.hi::after{content:"";position:absolute;right:0;top:48px;bottom:0;width:4px;background:#c2c5cf}
.lp.ly{background:linear-gradient(#f1edfd,#e9e4fb);display:grid;place-items:center;color:#a99bf0}
.lp.ly .ic{width:44px;height:44px;stroke-width:1.6}
.bd{position:absolute;top:10px;right:10px;height:23px;padding:0 11px;border-radius:99px;color:#fff;font-size:12.5px;font-weight:700;display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.bd.f{background:#16a97a}.bd.p{background:linear-gradient(135deg,#f59e0b,#d97706)}
.li{display:flex;align-items:center;padding:8px 8px 8px 8px;gap:4px}
.li>div{flex:1;min-width:0}
.li h4{font-size:15px;font-weight:700;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.au{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:13px;font-weight:600;color:#5a6578;line-height:20px}
.av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#6d4ee8);color:#fff;font-size:8.5px;font-weight:700;display:grid;place-items:center;flex:none}
.vw{display:flex;align-items:center;gap:6px;color:#8a94a6;font-size:12.5px;margin-top:1px;line-height:18px}
.vw .ic{width:15px;height:15px}
.sb{width:30px;height:30px;border-radius:50%;border:1px solid #d9dfe8;display:grid;place-items:center;color:#5a6578;flex:none;background:#fff}
.sb .ic{width:15px;height:15px}
.dlb{width:100%;height:30px;margin:0 8px 8px;border-radius:9px;background:#eef1f8;color:#4f46e5;font-weight:700;font-size:12.5px;width:calc(100% - 16px)}
.chips{display:flex;gap:8px;padding:14px 12px 0;overflow-x:auto;scrollbar-width:none}
.chips button{height:32px;padding:0 14px;border-radius:99px;background:#fff;border:1px solid #dfe4ec;font-weight:600;font-size:13px;color:#5a6578;white-space:nowrap}
.chips button.on{background:#2563eb;color:#fff;border-color:#2563eb}

/* Bottom nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-top:1px solid #e8ebf1;display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#93a0b4;font-size:12px;font-weight:500}
.nv .ic{width:23px;height:23px}
.nv.on{color:#2563eb}
body.noav nav{display:none}

/* Drawer */
#ov{position:fixed;inset:0;z-index:40;background:rgba(15,23,42,.32);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}
#ov.on{opacity:1;pointer-events:auto}
#dr{position:fixed;top:0;bottom:0;right:max(0px,calc((100vw - 480px)/2));width:301px;z-index:41;background:#fff;border-radius:20px 0 0 20px;display:flex;flex-direction:column;transform:translateX(110%);transition:transform .28s cubic-bezier(.3,.8,.3,1);box-shadow:-8px 0 30px rgba(15,23,42,.15);overflow:hidden}
#dr.on{transform:none}
.dh{background:#eef2f8;padding:26px 18px 22px 20px;display:flex;align-items:center;gap:15px;border-bottom:1px solid #e3e8f0}
.da{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#3f72f2,#2557e0);color:#fff;font-weight:700;font-size:16px;display:grid;place-items:center;box-shadow:0 0 0 3px #d9e6ff;flex:none}
.dh b{display:block;font-size:18px;font-weight:700;line-height:24px}
.dh span{display:block;font-size:14.5px;color:#6b7a90;line-height:21px;word-break:break-all}
.dl-list{flex:1;overflow-y:auto}
.dm{display:flex;align-items:center;gap:13px;padding:14px 18px 14px 20px;width:100%;text-align:left}
.dm i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.dm i .ic{width:21px;height:21px}
.dm div{flex:1}
.dm b{display:block;font-size:16.5px;font-weight:600;line-height:22px}
.dm span{display:block;font-size:14px;color:#718096;line-height:22px}
.dm>.ic{width:20px;height:20px;stroke-width:2.6;color:#111827}
.c-gold{background:#fef0c3;color:#d97706}.c-ind{background:#ebe9ff;color:#6d5ef0}.c-ind2{background:#e3e7fc;color:#4f46e5}
.lo{padding:14px 15px 16px;border-top:1px solid #e5e9f0}
.lo button{width:100%;height:52px;border-radius:14px;background:#fff0f0;border:2px solid #fbd0d0;color:#ef3b3b;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px}
.lo .ic{width:22px;height:22px;stroke-width:2.2}

/* Sub pages */
.pg{padding:16px 12px}
.card{background:#fff;border:1px solid #dfe4ec;border-radius:18px;padding:16px;margin-bottom:12px}
.card h3{font-size:16px;font-weight:700;margin-bottom:4px}
.card p.s{color:#6b7686;font-size:13.5px;line-height:21px}
.btn{height:46px;border-radius:14px;background:#2563eb;color:#fff;font-weight:700;font-size:15px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px}
.btn.alt{background:#eef1f8;color:#4f46e5}
.fld{width:100%;border:1px solid #dfe4ec;border-radius:12px;background:#fff;padding:12px 14px;font-size:14px;font-weight:500;outline:0;margin-top:6px}
.fld:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
textarea.fld{min-height:150px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55}
.lb{display:block;font-size:13px;font-weight:600;color:#475569;margin-top:12px}
.lb:first-child{margin-top:0}
.wal{border-radius:20px;padding:20px;color:#fff;background:linear-gradient(120deg,#1b2d80,#2457e0 55%,#0e90b2);margin-bottom:12px}
.wal span{font-size:13.5px;opacity:.85}.wal b{display:block;font-size:30px;font-weight:800;margin-top:4px}
.tabs{display:flex;background:#eef1f6;border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;height:36px;border-radius:11px;font-weight:600;font-size:13.5px;color:#6b7686}
.tabs button.on{background:#fff;color:#2563eb;box-shadow:0 1px 3px rgba(15,23,42,.1)}
.plan{border:2px solid #e4e8ef;border-radius:18px;padding:16px;background:#fff;margin-bottom:12px}
.plan.on{border-color:#2563eb}
.plan h3{display:flex;justify-content:space-between;align-items:center;font-size:17px}
.plan h3 em{font-style:normal;font-size:12px;background:#e4f8ef;color:#16a97a;padding:3px 10px;border-radius:99px}
.plan ul{list-style:none;margin-top:10px}
.plan li{display:flex;gap:8px;align-items:center;font-size:13.5px;color:#475569;padding:4px 0}
.plan li .ic{width:16px;height:16px;color:#16a97a;stroke-width:2.4}
.code{background:#eef1f8;border:2px dashed #c9d2e6;border-radius:14px;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;font-weight:800;letter-spacing:2px;font-size:17px;margin-top:10px}
.code button{height:34px;padding:0 14px;border-radius:10px;background:#2563eb;color:#fff;font-size:13px;font-weight:700;letter-spacing:0;display:flex;align-items:center;gap:6px}
.code .ic{width:15px;height:15px}
.pr{height:8px;border-radius:99px;background:#e4e8ef;overflow:hidden;margin-top:14px}
.pr i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2457e0,#0e90b2);transition:width .2s}
.ed{display:block;width:100%;height:calc(100vh - 140px);min-height:360px}
iframe.pv{width:100%;height:calc(100vh - 140px);min-height:360px;border:0;background:#fff;border-radius:14px;border:1px solid #dfe4ec}

/* Modal + toast */
#md{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
#md.on{opacity:1;pointer-events:auto}
#sheet{width:100%;max-width:480px;background:#fff;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .25s}
#md.on #sheet{transform:none}
#sheet h3{font-size:18px;font-weight:700;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);background:#0f172a;color:#fff;padding:11px 18px;border-radius:14px;font-size:13.5px;font-weight:600;z-index:70;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== v2: new pages ===== */
.hd{overflow:hidden}
.circ{display:none;width:38px;height:38px;border-radius:50%;border:1px solid #dfe5ee;margin-left:15px;flex:none}
#hm.store{padding-left:14px}
#hm.store .logo{width:34px;height:34px;border-radius:9px}
#hm.store .search{width:200px;margin-left:12px;border:1px solid #dfe5ee;background:#eef1f7}
#hm.store #flt{display:none}
#hm.store .circ{display:block}
#hm.plain .search{display:none}
.ic.fill{fill:currentColor;stroke:none}
.ic.sm{width:15px;height:15px}
.spn{width:22px;height:22px;border-radius:50%;border:3px solid #dce8fb;border-top-color:#2563eb;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.eb{width:72px;height:72px;border-radius:22px;background:#eef1f6;display:grid;place-items:center;margin:0 auto 20px;color:#8a94a6}
.eb .ic{width:30px;height:30px;stroke-width:1.7}

.sp{background:#eff1f7;min-height:calc(100vh - 55px);padding:17px 16px 100px}
.sp.lt{background:#f8fafc;padding:44px 12px 100px;min-height:100vh}
.sp.p0{padding:17px 12px 100px}
.pt{font-size:22px;font-weight:800;letter-spacing:-.3px;line-height:28px;display:flex;align-items:center;gap:8px}
.pst{font-size:14px;color:#9aa5ba;line-height:20px;margin-top:3px}

/* sort dropdown */
.sd{position:fixed;top:55px;right:max(20px,calc((100vw - 480px)/2 + 20px));width:169px;background:#fff;border:1.5px solid #dde3ec;border-radius:18px;padding:8px;box-shadow:0 12px 30px rgba(15,23,42,.14);z-index:25}
.so{display:flex;align-items:center;gap:10px;width:100%;height:47px;padding:0 0 0 10px;border-radius:12px;font-size:15px;font-weight:600;color:#6b7686;text-align:left;white-space:nowrap}
.so i{width:28px;height:28px;border-radius:8px;font-style:normal;font-size:14px;font-weight:700;display:grid;place-items:center;flex:none;white-space:nowrap;overflow:visible}
.so.on{background:#ece9fd;color:#7c3aed;font-weight:700}
.so:nth-child(1) i{background:#e3efff}.so:nth-child(2) i{background:#fff3e3}.so:nth-child(3) i{background:#d6f5e4}

/* modal (centered dialog) */
#md{align-items:center;background:rgba(15,23,42,.38);backdrop-filter:blur(5px);padding:20px}
#sheet{max-width:304px;border-radius:24px;padding:20px 19px 19px;transform:scale(.96);box-shadow:0 20px 50px rgba(0,0,0,.25)}
#md.on #sheet{transform:none}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}
.mh h3{margin:0!important;font-size:18px;font-weight:800;letter-spacing:-.3px}
.mx{width:30px;height:30px;border-radius:50%;background:#eef1f6;display:grid;place-items:center;color:#5a6b82}
.mx .ic{width:16px;height:16px;stroke-width:2.4}
.ml{display:block;font-size:13px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:#111827;margin:0 0 8px}
.mi{width:100%;height:41px;border:2px solid #dde4ee;border-radius:12px;padding:0 12px;font-size:15px;outline:0;margin-bottom:19px;background:#fff;font-weight:500}
.mi:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.14)}
.mi::placeholder{color:#94a3b8}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:17px}
.op{border:2px solid #dde4ee;border-radius:14px;height:113px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff}
.op i{width:38px;height:38px;border-radius:10px;background:#eef1f6;display:grid;place-items:center;color:#5a6b82;margin-bottom:9px}
.op i .ic{width:20px;height:20px}

/* ===== Build APK (responsive) ===== */
:root{--mw:480px}
body.wide{--mw:1100px}
#app{max-width:var(--mw)}
nav{max-width:var(--mw)}
#dr{right:max(0px,calc((100vw - var(--mw))/2))}

.ab{background:#f8fafc;padding:16px 14px 100px;min-height:calc(100vh - 55px)}
.ab-hd{display:flex;align-items:center;gap:8px}

.ab-tabs button{flex:1;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:12.5px;color:#6b7686;white-space:nowrap}
.ab-tabs button .ic{width:14px;height:14px}
.ab-tabs button.on{background:#fff;color:#2563eb;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.ab-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;margin-top:14px;align-items:start}
.ab-side{margin-top:2px}
@media(min-width:760px){
 .ab{padding:24px 28px 100px}
 .ab-grid{grid-template-columns:minmax(0,1.75fr) minmax(280px,1fr);gap:20px}
 .ab-side{position:sticky;top:72px;margin-top:0}
 .ab-hd h1{font-size:24px}
 .ab-tabs button{height:38px;font-size:13.5px}
}

.ab-sec{background:#fff;border:1px solid #e1e6ef;border-radius:16px;overflow:hidden;margin-bottom:12px}

.ab-sh i.n{width:22px;height:22px;border-radius:50%;background:#2563eb;color:#fff;font-style:normal;font-size:11.5px;font-weight:700;display:grid;place-items:center;flex:none}
.ab-sh em{font-style:normal;font-weight:400;color:#7b8798;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ab-sh .pro{background:#e0e9ff;color:#2563eb;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px}
.chv{margin-left:auto;color:#7b8798;display:grid;place-items:center}
.chv .ic{width:16px;height:16px;transition:transform .2s}
.ab-sec:not(.ab-closed) .chv .ic{transform:rotate(180deg)}
.ab-closed .ab-sb{display:none}

.ab-sb{padding:16px}
.ab-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ab-f{margin-bottom:14px;min-width:0}
.ab-l{display:block;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:#111827;margin-bottom:6px}
.ab-i{width:100%;height:38px;border:1px solid #dfe5ee;border-radius:10px;padding:0 12px;font-size:13.5px;background:#fff;outline:0;color:#0f172a}
.ab-i:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.ab-i::placeholder{color:#9aa4b5}
textarea.ab-i{height:auto;min-height:84px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;resize:vertical;line-height:1.5}
.ab-h{font-size:11.5px;color:#7b8798;margin-top:6px;line-height:17px}
.ab-h code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
.ab-seg{display:flex;gap:8px}
.ab-seg button{flex:1;height:34px;border-radius:9px;border:1px solid #dfe5ee;background:#fff;font-weight:600;font-size:12px;color:#5a6b82;display:flex;align-items:center;justify-content:center;gap:6px}
.ab-seg button .ic{width:14px;height:14px}
.ab-seg button.on{background:#2563eb;border-color:#2563eb;color:#fff}
.ab-up{height:116px;border:1.5px dashed #d4dcea;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#fff;text-align:center;padding:8px}
.ab-up:hover{border-color:#93b0f4}
.ab-up i{width:40px;height:40px;border-radius:10px;background:#eef1f7;display:grid;place-items:center;color:#8b97ab;margin-bottom:6px}
.ab-up i .ic{width:20px;height:20px}
.ab-up img{width:48px;height:48px;border-radius:10px;object-fit:cover;margin-bottom:6px}
.ab-up b{font-size:12px;font-weight:600;color:#475569}
.ab-up span{font-size:11px;color:#9aa4b5;line-height:16px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ab-up.big{height:150px}
.ab-up.big>.ic{width:30px;height:30px;color:#8b97ab;margin-bottom:8px}
.ab-up.big b{font-size:13.5px;color:#0f172a;font-weight:700}
.ab-col{display:flex;gap:10px}
.ab-col input[type=color]{width:38px;height:38px;border:1px solid #dfe5ee;border-radius:10px;padding:3px;background:#fff;cursor:pointer;flex:none}
.ab-g{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#7b8798;margin:2px 0 8px}
.ab-tg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.ab-tg:last-child{margin-bottom:0}
.ab-t{display:flex;align-items:center;gap:8px;justify-content:space-between;text-align:left;padding:10px 12px;min-height:56px;border:1px solid #dfe5ee;border-radius:10px;background:#f3f5fa;width:100%;transition:background .2s,border-color .2s}
.ab-t>div{min-width:0}
.ab-t b{display:block;font-size:12.5px;font-weight:600;color:#1e293b}
.ab-t .d{display:block;font-size:11px;color:#8794a8;margin-top:2px;line-height:15px}
.ab-t.on{background:#eef4ff;border-color:#a9c2f7}
.sw{width:40px;height:24px;border-radius:99px;background:#d5dae3;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.ab-t.on .sw{background:#2563eb}
.ab-t.on .sw::after{transform:translateX(16px)}
@media(max-width:330px){.ab-tg,.ab-row{grid-template-columns:1fr}}
.ab-pv{background:#fff;border:1px solid #e1e6ef;border-radius:16px;padding:18px 16px 16px;text-align:center}
.ab-ic{width:64px;height:64px;border-radius:16px;margin:0 auto 12px;background:linear-gradient(135deg,#dbe9ff,#c4dcff);border:1px solid #bcd3f8;display:grid;place-items:center;color:#2563eb;overflow:hidden}
.ab-ic .ic{width:26px;height:26px;stroke-width:1.6}
.ab-ic img{width:100%;height:100%;object-fit:cover}
.ab-pn{font-size:14px;font-weight:700;margin-bottom:3px;word-break:break-word}
.ab-pk{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#8794a8;word-break:break-all}
.ab-st{display:flex;justify-content:space-around;border-top:1px solid #e6eaf2;margin-top:14px;padding-top:12px;gap:6px}
.ab-st b{display:block;font-size:12px;font-weight:700}
.ab-st span{font-size:10.5px;color:#8794a8}
.ab-dl{margin-top:12px;background:#f3f5fa;border:1px solid #e6eaf2;border-radius:9px;padding:7px 8px;font-size:11px;color:#6b7686;word-break:break-all}
.ab-dl .ic{width:12px;height:12px;vertical-align:-2px}
.ab-dl code{font-family:ui-monospace,Menlo,Consolas,monospace;color:#2563eb;font-size:10.5px}
.ab-go{margin-top:12px;width:100%;height:46px;border-radius:14px;background:linear-gradient(90deg,#2563eb,#0ea5c9);color:#fff;font-weight:800;font-size:13.5px;letter-spacing:.6px;display:flex;align-items:center;justify-content:center;gap:8px;text-transform:uppercase;box-shadow:0 6px 16px rgba(37,99,235,.28)}
.ab-go .ic{width:18px;height:18px}
.ab-go:disabled{opacity:.7;cursor:wait}
.ab-pr{display:none;height:6px;border-radius:99px;background:#e4e8ef;overflow:hidden;margin-top:10px}
.ab-pr i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2563eb,#0ea5c9);transition:width .25s}
.ab-msg{font-size:12px;color:#6b7686;text-align:center;margin-top:8px;min-height:16px}
</style>

  +sec(2,'Icon &amp; Branding',`<div class="ab-row">${up('icon','App Icon','512x512 PNG','phone',B.icon)}${up('splash','Splash Screen','1080px+','image',B.splash)}</div><div class="ab-f" style="margin-bottom:0"><label class="ab-l">Status Bar Color</label><div class="ab-col"><input type="color" data-b="color" value="${B.color}" aria-label="Pick a color"><input class="ab-i" data-b="colorT" value="${esc(B.color)}" maxlength="7" placeholder="#2563eb"></div></div>`)
  +sec(3,'Behavior &amp; Permissions',TG.map(g=>`<div class="ab-g">${g[0]}</div><div class="ab-tg">${g[1].map(x=>tCard(x[0],x[1],x[2])).join('')}</div>`).join(''))
  +csec(4,'pro','Pro Features','<span class="pro">PRO</span>','Encryption \u00B7 Push \u00B7 Ads',`<div class="ab-tg">${PRO.map(x=>tCard(x[0],x[1],x[2])).join('')}</div>`)
  +sec(5,'Share &amp; Rate',`<div class="ab-f"><label class="ab-l">Share Message</label>${inp('msg','Check out this app!')}</div><div class="ab-f" style="margin-bottom:0"><label class="ab-l">Share Link (optional)</label>${inp('link','https://play.google.com/store/apps/details?id=...','type="url"')}<div class="ab-h">Works when the website calls <code>AndroidDownloader.shareApp()</code> and <code>AndroidDownloader.rateApp()</code></div></div>`,'<em>Optional</em>')
  +csec(6,'adv','Advanced / Developer','','Custom CSS/JS, webhooks',`<div class="ab-f"><label class="ab-l">Custom CSS</label><textarea class="ab-i" data-b="css" placeholder="body { ... }">${esc(B.css)}</textarea></div><div class="ab-f"><label class="ab-l">Custom JS</label><textarea class="ab-i" data-b="js" placeholder="console.log('ready')">${esc(B.js)}</textarea></div><div class="ab-f" style="margin-bottom:0"><label class="ab-l">Webhook URL</label>${inp('hook','https://example.com/webhook','type="url"')}</div>`);
 }else{
  left=sec(1,'App Information',`<div class="ab-row"><div class="ab-f"><label class="ab-l">App Name *</label>${inp('kn','My Native App')}</div><div class="ab-f"><label class="ab-l">Package Name *</label>${inp('kp','com.myapp.main')}</div></div>${vers('kv','kc')}`)
  +sec(2,'Upload ZIP (Kotlin / Java Project)',`<label class="ab-up big" for="fu_zip">${I('upload')}<b>${B.zip?esc(B.zip.name):'Drop ZIP file here'}</b><span>${B.zip?(B.zip.size/1048576).toFixed(2)+' MB \u2014 click to change':'Android Studio project ZIP or click to browse'}</span>${B.zip?'':'<span>.kt / .java / layout XML included</span>'}</label><input type="file" id="fu_zip" data-f="zip" accept=".zip" hidden>`);
 }
 return `<div class="ab"><div class="ab-hd"><i>${I('zap')}</i><h1>Build APK</h1></div><p class="ab-sub">Convert your project to an Android APK</p>
 <div class="ab-tabs"><button class="${k?'':'on'}" data-a="bmode" data-id="html">${I('globe')}HTML / CSS / JS</button><button class="${k?'on':''}" data-a="bmode" data-id="kt">${I('code')}Kotlin / Java</button></div>
 <div class="ab-grid"><div>${left}</div><aside class="ab-side"><div class="ab-pv" id="abpv">${sideCard()}</div><button class="ab-go" id="abgo" data-a="dobuild">${I('zap')}Build APK</button><div class="ab-pr" id="abpr"><i id="abbar"></i></div><div class="ab-msg" id="abmsg"></div></aside></div></div>`;
};

P.editor=(id)=>{
 const p=projects.find(x=>x.id===id);if(!p)return sub('<div class="empty"><b>Project not found</b></div>');
 return `<div class="pg"><div class="tabs"><button class="on" data-a="etab" data-id="c">Code</button><button data-a="etab" data-id="p">Preview</button></div><textarea class="fld ed" id="ec" spellcheck="false" style="margin:0">${esc(p.code)}</textarea><iframe class="pv" id="ep" hidden sandbox="allow-scripts"></iframe></div>`;
};

const TITLES={projects:'My Projects',profile:'Profile',wallet:'Wallet',payments:'My Payments',subscription:'Subscription',refer:'Refer & Earn',notifications:'Push Notifications',converter:'Secure Converter',build:'Build APK',editor:'Editor'};
const MAIN=['home','store','lab'];
let cur='home',arg='';

function render(){
 const f=P[cur]||P.home;
 $('#view').innerHTML=f(arg);post();
}
const PLAIN=['profile','wallet','payments','subscription','refer','converter','build'];
function route(){
 const h=(location.hash.slice(2)||'home').split('/');
 cur=P[h[0]]?h[0]:'home';arg=h[1]||'';
 closeDrawer();closeSort();
 q='';$('#q').value='';
 const plain=PLAIN.includes(cur),main=MAIN.includes(cur)||plain,nohd=cur==='subscription';
 $('#hm').hidden=!main||nohd;$('#hs').hidden=main;
 $('#hm').classList.toggle('plain',plain);$('#hm').classList.toggle('store',cur==='store');
 $('#q').placeholder=cur==='store'?'Search templates...':'Search projects';
 if(!main){$('#ht').textContent=cur==='editor'?((projects.find(x=>x.id===arg)||{}).name||'Editor'):TITLES[cur];
  $('#hx').innerHTML=cur==='editor'?'<button class="sv" data-a="saveed">Save</button>':'';}
 document.body.classList.toggle('noav',cur==='editor');document.body.classList.toggle('wide',cur==='build');
 document.querySelectorAll('.nv[data-go]').forEach(b=>b.classList.toggle('on',b.dataset.go===cur));
 render();window.scrollTo(0,0);
}

/* Drawer */
const MENU=[['user','Profile','Account settings','c-blue','profile'],['card','Wallet','Balance & transactions','c-amber','wallet'],['receipt','My Payments','Track pending & past requests','c-gold','payments'],['star','Subscription','Plans & upgrades','c-purple','subscription'],['users','Refer & Earn','Invite friends, get bonus','c-green','refer'],['bell','Push Notifications','Send & manage alerts','c-ind','notifications'],['lock','Secure Converter','Obfuscate your HTML/JS/CSS','c-ind2','converter']];
function drawer(){
 $('#dml').innerHTML=MENU.map(m=>`<button class="dm" data-go="${m[4]}"><i class="${m[3]}">${I(m[0])}</i><div><b>${m[1]}</b><span>${m[2]}</span></div>${I('chev')}</button>`).join('');
 $('#dnm').textContent=user.name;$('#dem').textContent=user.email;$('#dav').textContent=ini();
}
function openDrawer(){drawer();$('#ov').classList.add('on');$('#dr').classList.add('on');document.querySelectorAll('.nv').forEach(b=>b.classList.toggle('on',b.dataset.a==='more'))}
function closeDrawer(){$('#ov').classList.remove('on');$('#dr').classList.remove('on');document.querySelectorAll('.nv').forEach(b=>b.classList.toggle('on',b.dataset.go===cur))}

/* Modal + toast */
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
function modal(h){$('#sheet').innerHTML=h;$('#md').classList.add('on')}
function closeModal(){$('#md').classList.remove('on')}
$('#md').addEventListener('click',e=>{if(e.target.id==='md')closeModal()});

function mkProject(name,code,type){projects.unshift({id:'p'+Date.now(),name:name,t:Date.now(),code:code||DEF,type:type||'blank'});save()}

/* Actions */
const A={
 more:openDrawer,close:closeDrawer,
 back:()=>{history.length>1?history.back():location.hash='#/home'},
 new:()=>{ntype='blank';modal(`<div class="mh"><h3>Create New Project</h3><button class="mx" data-a="mclose" aria-label="Close">${I('close')}</button></div><label class="ml">Project name</label><input class="mi" id="nn" placeholder="My Awesome App" maxlength="40" autocomplete="off"><label class="ml">Start with</label><div class="ops">${OPT.map(o=>`<button class="op ${o[0]==='blank'?'on':''}" data-a="opt" data-id="${o[0]}"><i${o[0]==='kotlin'?' style="color:#7c4dec"':''}>${I(o[3])}</i><b>${o[1]}</b><span>${o[2]}</span></button>`).join('')}</div><button class="mc" data-a="create">${I('plus')}Create Project</button>`);setTimeout(()=>{const n=$('#nn');if(n)n.focus()},80)},
 opt:(el)=>{ntype=el.dataset.id;el.parentNode.querySelectorAll('.op').forEach(b=>b.classList.toggle('on',b===el))},
 create:()=>{const n=($('#nn').value||'').trim();if(!n){toast('Enter a project name');return}mkProject(n,null,ntype);closeModal();render();toast('Project created')},
 mclose:()=>closeModal(),
 sort:(el)=>{sort=el.dataset.id;closeSort();render()},
 editprof:()=>modal(`<div class="mh"><h3>Edit Profile</h3><button class="mx" data-a="mclose">${I('close')}</button></div><label class="ml">Full name</label><input class="mi" id="pn" value="${esc(user.name)}"><label class="ml">Email</label><input class="mi" id="pe" value="${esc(user.email)}"><button class="mc" data-a="saveprof">Save changes</button>`),
 recharge:()=>modal(`<div class="mh"><h3>Recharge</h3><button class="mx" data-a="mclose">${I('close')}</button></div><label class="ml">Amount</label><input class="mi" id="ra" type="number" placeholder="100" min="10"><label class="ml">Method</label><select class="mi" id="rm"><option>bKash</option><option>Nagad</option><option>Rocket</option></select><label class="ml">Transaction ID</label><input class="mi" id="rt" placeholder="8N7A6D5E4C"><button class="mc" data-a="rsub">Submit request</button>`),
 rsub:()=>{const a=+$('#ra').value,t=$('#rt').value.trim();if(!(a>=10)){toast('Enter at least \u09F310');return}if(!t){toast('Enter the transaction ID');return}payments.unshift({id:'x'+Date.now(),amt:a,m:$('#rm').value,tx:t,s:'Pending',t:Date.now()});save();closeModal();toast('Recharge request submitted');location.hash='#/payments'},
 pfil:(el)=>{pfil=el.dataset.id;render()},
 plan:()=>toast('Insufficient wallet balance. Recharge first.'),
 copyref:()=>{try{navigator.clipboard.writeText(refLink())}catch(e){}toast('Link copied')},
 wa:()=>{window.open('https://wa.me/?text='+encodeURIComponent('Join me on Wevlo: '+refLink()),'_blank')},
 tg:()=>{window.open('https://t.me/share/url?url='+encodeURIComponent(refLink())+'&text='+encodeURIComponent('Join me on Wevlo'),'_blank')},
 shr:()=>{if(navigator.share){navigator.share({title:'Wevlo',url:refLink()}).catch(()=>{})}else{A.copyref()}},
 cmode:(el)=>{cmode=el.dataset.id;cfiles=[];render()},
 conv:async()=>{if(!cfiles.length)return;const b=$('#cb');b.disabled=true;b.textContent='Converting...';
  try{await loadZip();const out=new JSZip();
   if(cmode==='zip'){const z=await JSZip.loadAsync(cfiles[0]);for(const n of Object.keys(z.files)){const f=z.files[n];if(f.dir)continue;if(/\.html?$/i.test(n))out.file(n,wrapHtml(await f.async('string')));else out.file(n,await f.async('uint8array'))}}
   else{for(const f of cfiles){if(/\.html?$/i.test(f.name))out.file(f.name,wrapHtml(await f.text()));else out.file(f.name,f)}}
   const blob=await out.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='converted.zip';document.body.appendChild(a);a.click();a.remove();toast('Conversion complete');
  }catch(e){toast('Conversion failed. Check your internet and file.')}
  b.textContent='Convert Project';b.disabled=!cfiles.length},
 imp:()=>modal(`<h3>Import Project</h3><p class="s" style="color:#6b7686;font-size:13.5px;line-height:21px">Choose an HTML file from your device.</p><input class="fld" id="fi" type="file" accept=".html,.htm,.txt"><button class="btn" data-a="doimp">${I('upload')}Import</button>`),
 doimp:()=>{const f=$('#fi').files[0];if(!f){toast('Select a file first');return}const r=new FileReader();r.onload=()=>{mkProject(f.name.replace(/\.[^.]+$/,''),String(r.result));closeModal();render();toast('Project imported')};r.readAsText(f)},
 edit:(el)=>{location.hash='#/editor/'+el.dataset.id},
 build:(el)=>{const p=projects.find(x=>x.id===el.dataset.id);if(p){B.mode='html';B.name=p.name;B.pkg=pkgFrom(p.name);B.pkgM=false;B.src='proj';B.pid=p.id;B.init=1}location.hash='#/build'},
 del:(el)=>{const p=projects.find(x=>x.id===el.dataset.id);if(p&&confirm('Delete "'+p.name+'"?')){projects=projects.filter(x=>x!==p);save();render();toast('Project deleted')}},
 share:(el)=>{const u=location.href.split('#')[0]+'#/lab';if(navigator.share){navigator.share({title:'WEVLO',url:u}).catch(()=>{})}else{try{navigator.clipboard.writeText(u)}catch(e){}toast('Link copied')}},
 get:(el)=>{const t=TPL.find(x=>x.id===el.dataset.id);if(t.price){toast('Insufficient wallet balance');return}if(downloads.some(d=>d.id===t.id)){toast('Already downloaded');return}downloads.unshift({id:t.id,name:t.name,t:Date.now()});save();toast('Downloaded '+t.name)},
 cat:(el)=>{cat=el.dataset.id;render()},
 saveprof:()=>{const n=$('#pn').value.trim(),e=$('#pe').value.trim();if(!n||!e){toast('Fill in all fields');return}user={name:n,email:e};save();closeModal();render();toast('Profile updated')},
 addmoney:()=>toast('Payment gateway not connected'),
 upgrade:()=>toast('Payment gateway not connected'),
 ptab:(el)=>{el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el))},
 copy:()=>{try{navigator.clipboard.writeText($('.code span').textContent)}catch(e){}toast('Code copied')},
 sendn:()=>{if(!$('#nt').value.trim()||!$('#nm').value.trim()){toast('Enter a title and message');return}$('#nt').value='';$('#nm').value='';toast('Alert sent')},
 etab:(el)=>{const c=el.dataset.id==='c';el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));$('#ec').hidden=!c;$('#ep').hidden=c;if(!c)$('#ep').srcdoc=$('#ec').value},
 saveed:()=>{const p=projects.find(x=>x.id===arg);if(p){p.code=$('#ec').value;p.t=Date.now();save();toast('Saved')}},
 bmode:(el)=>{B.mode=el.dataset.id;render()},
 src:(el)=>{B.src=el.dataset.id;render()},
 sec:(el)=>{const k=el.dataset.id;B.open[k]=!B.open[k];const sc=el.closest('.ab-sec');sc.classList.toggle('ab-closed',!B.open[k]);el.setAttribute('aria-expanded',B.open[k])},
 tgl:(el)=>{const k=el.dataset.id;B.t[k]=!B.t[k];el.classList.toggle('on',B.t[k]);el.setAttribute('aria-checked',B.t[k])},
 dobuild:async()=>{if(B.run)return;const k=B.mode==='kt';
  const name=(k?B.kn:B.name).trim(),pkg=(k?B.kp:B.pkg).trim();
  if(!name){toast('Enter an app name');return}
  if(!/^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$/.test(pkg)){toast('Package name must look like com.myapp.name');return}
  if(!k&&B.src==='url'&&!/^https?:\/\/[^\s.]+\.[^\s]+$/i.test(B.url.trim())){toast('Enter a valid website URL');return}
  if(!k&&B.src==='proj'&&!B.pid){toast('Create a project first');return}
  if(k&&!B.zip){toast('Upload your project ZIP first');return}
  if(!k&&['enc','push','ads'].some(x=>B.t[x])){toast('Pro features need a Pro plan');return}
  const cfg=k?{type:'kotlin-java',name:name,package:pkg,versionName:B.kv,versionCode:+B.kc||1,zip:B.zip.name}:{type:'html',name:name,package:pkg,versionName:B.ver,versionCode:+B.code||1,source:B.src,url:B.src==='url'?B.url.trim():undefined,project:B.src==='proj'?B.pid:undefined,statusBarColor:B.color,options:B.t,share:{message:B.msg,link:B.link},customCss:B.css,customJs:B.js,webhook:B.hook};
  B.run=true;const btn=$('#abgo'),bar=$('#abbar'),msg=$('#abmsg');btn.disabled=true;bar.parentNode.style.display='block';
  const steps=['Preparing project...','Packaging assets...','Signing APK...','Finalizing...'];let w=0;
  const done=(ok,m)=>{B.run=false;btn.disabled=false;msg.textContent=m;toast(m)};
  const dl=(blob,fn)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove()};
  const iv=setInterval(async()=>{w=Math.min(96,w+Math.random()*12+5);bar.style.width=w+'%';msg.textContent=steps[Math.min(3,Math.floor(w/25))];
   if(w>=96){clearInterval(iv);
    try{
     if(BUILD_ENDPOINT){const r=await fetch(BUILD_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)});if(!r.ok)throw 0;dl(await r.blob(),pkg+'.apk');bar.style.width='100%';done(true,'Build complete')}
     else{dl(new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'}),pkg+'.build.json');bar.style.width='100%';done(true,'Build config downloaded (set BUILD_ENDPOINT for a real APK)')}
    }catch(e){bar.style.width='0';done(false,'Build failed. Check your build server.')}
   }},300)},
 logout:()=>{closeDrawer();toast('Logged out')},
};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a],[data-go]');if(!el)return;
 if(el.dataset.a){const f=A[el.dataset.a];if(f){f(el)}}
 else if(el.dataset.go){const g=el.dataset.go;if(location.hash==='#/'+g){closeDrawer();render()}else location.hash='#/'+g}
});
$('#q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();if(MAIN.includes(cur)||cur==='projects')render()});
$('#flt').addEventListener('click',e=>{e.preventDefault();$('#sd').hidden?openSort():closeSort()});
document.addEventListener('click',e=>{if(!e.target.closest('#sd,#flt'))closeSort()},true);
document.addEventListener('change',e=>{if(e.target.id!=='cf')return;cfiles=[...e.target.files];const b=$('#cb');if(b)b.disabled=!cfiles.length;if(cfiles.length){$('#dzt').textContent=cfiles.length>1?cfiles.length+' files selected':cfiles[0].name;$('#dzp').innerHTML=(cfiles.reduce((a,f)=>a+f.size,0)/1024).toFixed(1)+' KB<br>or click to browse again'}});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('.dz'))e.preventDefault()});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('.dz');if(!z)return;e.preventDefault();const i=$('#cf');i.files=e.dataTransfer.files;i.dispatchEvent(new Event('change',{bubbles:true}))});
document.addEventListener('input',e=>{const el=e.target,k=el.dataset&&el.dataset.b;if(!k)return;let v=el.value;
 if(k==='colorT'){if(/^#[0-9a-f]{6}$/i.test(v)){B.color=v;const c=$('[data-b=color]');if(c)c.value=v}return}
 if(k==='color'){B.color=v;const t=$('[data-b=colorT]');if(t)t.value=v;return}
 if(k==='pkg'||k==='kp'){v=v.toLowerCase().replace(/\s/g,'');if(el.value!==v)el.value=v;if(k==='pkg')B.pkgM=true}
 B[k]=v;
 if(k==='name'&&!B.pkgM){B.pkg=pkgFrom(v);const i=$('[data-b=pkg]');if(i)i.value=B.pkg}
 const pv=$('#abpv');if(pv)pv.innerHTML=sideCard()});
document.addEventListener('change',e=>{const el=e.target,f=el.dataset&&el.dataset.f;if(!f||!el.files||!el.files[0])return;const file=el.files[0];
 if(f==='zip'){B.zip=file;render();return}
 const r=new FileReader();r.onload=()=>{B[f]=r.result;render()};r.readAsDataURL(file)});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('.ab-up'))e.preventDefault()});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('.ab-up');if(!z)return;e.preventDefault();const i=document.getElementById(z.getAttribute('for'));if(i&&e.dataTransfer.files.length){i.files=e.dataTransfer.files;i.dispatchEvent(new Event('change',{bubbles:true}))}});
window.addEventListener('hashchange',route);
route();
})();
</script>
